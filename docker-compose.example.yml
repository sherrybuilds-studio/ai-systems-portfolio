# Example docker-compose for SherryOS stack
# This is a TEMPLATE — no real ports, credentials, or hostnames.
# Copy and fill in your own values.

version: "3.9"

services:
  # PostgreSQL — task queue + lead storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  # Embeddings service — shared MiniLM model
  embeddings:
    build: ./services/embeddings
    ports:
      - "127.0.0.1:7010:7010"
    environment:
      MODEL_NAME: all-MiniLM-L6-v2

  # API gateway
  gateway:
    build: ./services/gateway
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  pgdata:
