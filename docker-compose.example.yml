# Example docker-compose for SherryOS stack
# This is a TEMPLATE: no ports, credentials or hostnames. The services reach
# each other on the compose network; publish a port only where you need one.
# Copy and fill in your own values.

version: "3.9"

services:
  # PostgreSQL — task queue + lead storage
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Embeddings service — shared MiniLM model
  embeddings:
    build: ./services/embeddings
    environment:
      MODEL_NAME: ${EMBEDDING_MODEL}

  # API gateway
  gateway:
    build: ./services/gateway
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  pgdata:
